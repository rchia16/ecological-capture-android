# Review template only. Replace the reserved domain and certificate paths after host approval.
# Included inside nginx's http context. No service has been deployed.
server {
    listen 80;
    server_name gateway.example.invalid;
    access_log off;
    error_log /dev/null;
    return 444;
}
server {
    listen 443 ssl;
    server_name gateway.example.invalid;
    ssl_certificate /etc/ecocapture/tls/fullchain.pem;
    ssl_certificate_key /etc/ecocapture/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    # nginx error messages can include raw request URIs. Operational monitoring must
    # collect approved aggregate metrics instead of enabling request/error dumps.
    error_log /dev/null;
    client_max_body_size 4m;
    client_body_timeout 30s;
    send_timeout 30s;
    if ($host != gateway.example.invalid) { return 444; }
    location /v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host gateway.example.invalid;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 120s;
    }
    location / { return 404; }
}
